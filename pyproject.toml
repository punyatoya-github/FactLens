[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "factlens"
version = "0.1.0"
description = "An advanced RAG-based document analysis assistant focused on explainable, verifiable answers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Punyatoya Mohanty" }]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5,<2",
    "docling>=2.140,<3",
    "gradio>=6.30,<7",
    "langchain-chroma>=1.1,<2",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.7,<2",
    "langchain-text-splitters>=1.1,<2",
    "langgraph>=1.2,<2",
    "loguru>=0.7,<0.8",
    "pydantic-settings>=2.16,<3",
    "rank-bm25>=0.2.2,<0.3",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.4,<3",
    "pre-commit>=4,<5",
    "pytest>=9.1,<10",
    "ruff>=0.17,<0.18",
]

[project.scripts]
factlens = "factlens.ui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/factlens"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["factlens"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["docling.*", "rank_bm25.*", "chromadb.*"]
ignore_missing_imports = true
